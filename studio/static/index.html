<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapyPunk Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root { color-scheme: dark; --ink: #07080d; --panel: #10121b; --line: #262a3a; --fg: #e8e6ef; --dim: #8d8fa3;
  --cyan: #2ee6ff; --yuzu: #f2c94c; --pink: #ff3ea5; --alarm: #ff5a5a; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink); color: var(--fg); font: 15px/1.55 "IBM Plex Sans", Arial, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
h1 { margin: 0; font: 800 46px/1 "Big Shoulders Display", "Arial Narrow", sans-serif; text-transform: uppercase; }
h1 span { color: var(--yuzu); }
.sub { color: var(--dim); margin: 6px 0 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
label { font: 500 12px "IBM Plex Mono", monospace; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
textarea, input { width: 100%; margin-top: 8px; background: #0b0d14; color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 12px; font: inherit; resize: vertical; }
textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
button { font: 600 14px "IBM Plex Sans", Arial, sans-serif; border-radius: 999px; padding: 11px 18px; cursor: pointer;
  border: 1px solid var(--line); background: #151827; color: var(--fg); }
button.primary { background: var(--yuzu); border-color: var(--yuzu); color: #1a1405; }
button:disabled { opacity: .5; cursor: default; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 7px 11px; }
.status { font: 500 13px "IBM Plex Mono", monospace; color: var(--cyan); }
.status.err { color: var(--alarm); }
.result h2 { margin: 0 0 4px; font: 800 30px/1.05 "Big Shoulders Display", "Arial Narrow", sans-serif; text-transform: uppercase; }
.frame { width: 100%; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 8px; background: #000; margin-top: 12px; }
.files { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.files a { font: 500 12px "IBM Plex Mono", monospace; color: var(--cyan); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
.grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
.list { display: grid; gap: 8px; }
.item { text-align: left; border-radius: 8px; padding: 10px 12px; }
.item small { display: block; color: var(--dim); font: 500 11px "IBM Plex Mono", monospace; margin-top: 2px; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 36px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Capy<span>Punk</span> Studio</h1>
    <p class="sub">Type a premise. An agent on HarnessRouter (Qwen4-Max) writes a playable choose-your-own-adventure skit, with every scene's shot prompt ready for the CapyPunk film pipeline.</p>
  </header>
  <div class="grid">
    <section class="panel">
      <label for="prompt">Your premise</label>
      <textarea id="prompt" rows="4" placeholder="A capybara barista discovers the espresso machine is a sentient AI that only speaks in haiku."></textarea>
      <div class="row">
        <button class="primary" id="go">Write my skit</button>
        <div class="chips">
          <button class="chip" data-p="A capybara lifeguard at a rooftop hot spring has to choose between saving a rival or the city's last yuzu harvest.">Hot-spring heist</button>
          <button class="chip" data-p="A capybara detective in a rainy neon city interrogates a vending machine that witnessed a crime.">Neon noir</button>
          <button class="chip" data-p="A capybara astronaut is the only crew member calm enough to talk down a panicking ship AI.">Space calm</button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="result" id="result" hidden>
        <h2 id="rtitle"></h2>
        <p id="rsum"></p>
        <iframe id="frame" class="frame" title="Playable story" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer"></iframe>
        <div class="files" id="files"></div>
        <label for="follow" style="display:block;margin-top:16px">Revise it</label>
        <input id="follow" placeholder="Make the ending darker, and give the villain a better line.">
        <div class="row"><button id="again">Revise</button></div>
      </div>
    </section>
    <aside class="panel">
      <label>Your stories</label>
      <div class="list" id="list"></div>
    </aside>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, timer = null;
const say = (t, err) => { $("status").textContent = t; $("status").className = "status" + (err ? " err" : ""); };
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "Something went wrong.");
  return data;
}
async function refreshList() {
  const { tasks } = await api("/api/tasks");
  $("list").innerHTML = "";
  if (!tasks.length) { $("list").innerHTML = '<p class="sub">Nothing yet. Your skits appear here.</p>'; return; }
  for (const t of tasks) {
    const b = document.createElement("button"); b.className = "item";
    b.textContent = t.title || t.prompt.slice(0, 60);
    const s = document.createElement("small"); s.textContent = `${t.status.replace("_", " ")} · ${t.turns} version${t.turns > 1 ? "s" : ""}`;
    b.appendChild(s); b.onclick = () => open(t.id); $("list").appendChild(b);
  }
}
function show(t) {
  if (t.status === "in_progress") { say("Writing... an agent is drafting the scenes, building the playable page and checking its links."); return; }
  if (t.status === "role_mismatch") { say("That doesn't look like a story premise. Describe a character, a place and a problem.", true); return; }
  if (t.error) { say(t.error, true); return; }
  say("");
  $("result").hidden = false;
  $("rtitle").textContent = t.title || "Your skit";
  $("rsum").textContent = t.summary || t.answer || "";
  if (t.preview && $("frame").dataset.src !== t.preview) { $("frame").src = t.preview; $("frame").dataset.src = t.preview; }
  $("files").innerHTML = "";
  for (const f of t.files || []) {
    const a = document.createElement("a"); a.href = `/api/tasks/${t.id}/files/${encodeURIComponent(f.path).replace(/%2F/g, "/")}`;
    a.textContent = `${f.path} (${Math.max(1, Math.round((f.bytes || 0) / 1024))} KB)`; $("files").appendChild(a);
  }
}
async function poll() {
  clearTimeout(timer);
  if (!current) return;
  try {
    const t = await api(`/api/tasks/${current}`);
    show(t);
    if (t.status === "in_progress") timer = setTimeout(poll, 4000); else refreshList();
  } catch (e) { say(e.message, true); }
}
function open(id) { current = id; $("result").hidden = true; $("frame").dataset.src = ""; poll(); }
$("go").onclick = async () => {
  const prompt = $("prompt").value.trim();
  if (prompt.length < 3) { say("Write a premise first.", true); return; }
  $("go").disabled = true;
  try { const t = await api("/api/tasks", { method: "POST", body: JSON.stringify({ prompt }) }); open(t.id); refreshList(); }
  catch (e) { say(e.message, true); }
  finally { $("go").disabled = false; }
};
$("again").onclick = async () => {
  const prompt = $("follow").value.trim();
  if (!current || prompt.length < 3) return;
  try { await api(`/api/tasks/${current}/followup`, { method: "POST", body: JSON.stringify({ prompt }) }); $("follow").value = ""; $("result").hidden = true; poll(); }
  catch (e) { say(e.message, true); }
};
document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { $("prompt").value = b.dataset.p; });
refreshList().catch(() => {});
</script>
</body>
</html>
