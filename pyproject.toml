[project]
name = "capypunk"
version = "0.1.0"
description = "CapyPunk: an interactive cyberpunk film written, rendered and personalized by a Bruin pipeline."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=17",
    "duckdb>=1.4,<1.6",
    "bruin-sdk[duckdb]>=0.5",
    "pytz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/capypunk"]
